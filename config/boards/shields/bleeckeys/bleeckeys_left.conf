# Uncomment to enable encoder

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
CONFIG_ZMK_DISPLAY=y
# Screen updates on their own low-priority thread: on the system work queue they held up
# key scanning while the animations redrew the OLED, and key presses were missed
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=3072
# Own status screen (status_screen.c, display_fx.c) showing both halves' battery
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
# Caps Lock inversion, canvases for the display_fx.c effects
CONFIG_ZMK_HID_INDICATORS=y
CONFIG_LV_USE_CANVAS=y
CONFIG_LV_USE_THEME_MONO=y
# LVGL heap: the status screen objects plus their animations
CONFIG_LV_Z_MEM_POOL_SIZE=8192
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_16=y
CONFIG_LV_FONT_MONTSERRAT_12=y
CONFIG_ZMK_POINTING=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_INPUT_THREAD_STACK_SIZE=4096